services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - recordya-chat-network

  # Backend (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      CORS_ORIGINS: ${CORS_ORIGINS}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}
      DEBUG: ${DEBUG:-true}
      ENV: ${ENV:-local}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
      AUTH_MODE: ${AUTH_MODE:-keycloak}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_FRONTEND_URL: ${KEYCLOAK_FRONTEND_URL:-http://localhost:8180}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-recordya}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-recordya-chat}
      SMTP_HOST: mailpit
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_FROM: ${SMTP_FROM:-Recordya Local <noreply@localhost>}
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./backend:/app
      - ./keycloak:/keycloak:ro
      - ../plugins:/plugins
    networks:
      - recordya-chat-network
    command: >
      sh -c "
        pip install -e '.[dev]' --quiet &&
        alembic upgrade head &&
        uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # Keycloak Database (separate from app DB)
  # Only starts with --profile sso (AUTH_MODE=keycloak)
  keycloak-db:
    profiles: ["sso"]
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - recordya-chat-network

  # Keycloak (SSO / Identity Provider)
  # Only starts with --profile sso (AUTH_MODE=keycloak)
  keycloak:
    profiles: ["sso"]
    image: quay.io/keycloak/keycloak:26.2
    restart: unless-stopped
    command: start-dev --import-realm --health-enabled=true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      KEYCLOAK_THEME_NAME: ${KEYCLOAK_THEME_NAME:-recordya}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-recordya}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-recordya-chat}
      KEYCLOAK_CLIENT_NAME: ${KEYCLOAK_CLIENT_NAME:-Recordya Chat}
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    volumes:
      # DEV ONLY: realm-export.json seeds a development admin@test.com/admin123
      # user (imported on first start). Remove/disable it before any non-local
      # deployment. See docs/authentication.md → Realm Seed.
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
      - ${KEYCLOAK_THEME_DIR:-./keycloak/themes/recordya}:/opt/keycloak/themes/${KEYCLOAK_THEME_NAME:-recordya}:ro
    networks:
      - recordya-chat-network

  # Mailpit (local email sink — catches SMTP from Keycloak and src.services.email)
  # Always starts with `docker compose up`. Backend points at it via SMTP_HOST=mailpit.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    networks:
      - recordya-chat-network

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ../plugins:/plugins
    networks:
      - recordya-chat-network
    command: >
      sh -c "
        npm install --silent &&
        npm run dev -- --host 0.0.0.0 --port 8080
      "

volumes:
  postgres_data:
    driver: local
  keycloak_data:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  recordya-chat-network:
    driver: bridge
