[project]
name = "recordya-chat-backend"
version = "0.1.0"
description = "Knowledge Base - Backend API with pluggable data source architecture"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "openai>=1.12",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.6",
    "httpx>=0.26",
    "pyyaml>=6.0",
    "sse-starlette>=1.6.0",
    "langfuse>=2.0.0",
    "mcp>=1.15",
    "aiosmtplib>=5.1,<6",
    "Pillow>=10.0",
    "fastmcp>=3.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.2",
    "mypy>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "../plugins"]
pythonpath = [".", ".."]
markers = [
    "prompt_eval: marks tests as prompt evaluation tests (deselect with '-m \"not prompt_eval\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
